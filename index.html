<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>AstroSelf — Astronaut Health Monitor</title>
  <meta name="description" content="Self-assessment health monitor for astronauts. Works without Earth, with NASA data and standards.">
  <meta name="theme-color" content="#070b14">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="assets/icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="assets/icons/icon-192.png">
  <link rel="stylesheet" href="css/style.css">
  <script type="importmap">{ "imports": { "three": "./vendor/three.module.min.js" } }</script>
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <img src="assets/icons/icon.svg" alt="" width="44" height="44">
      <strong data-i18n="app.name">AstroSelf</strong>
    </div>
    <div class="topbar-controls">
      <details class="menu">
        <summary class="btn" data-i18n="menu.demo">Demo</summary>
        <div class="menubox" id="demoBox"></div>
      </details>
      <label class="envpick">
        <select id="envSelect" aria-label="Environment"></select>
      </label>
      <div class="seg lang" role="group" aria-label="Language">
        <button type="button" data-lang="en">EN</button>
        <button type="button" data-lang="tr">TR</button>
      </div>
      <button type="button" id="emBtn" class="embtn">🚨 <span data-i18n="em.button">EMERGENCY</span></button>
    </div>
  </header>

  <nav class="tabs" role="tablist" aria-label="Main screens">
    <button type="button" class="tab" data-view="dashboard" data-i18n="nav.dashboard">Dashboard</button>
    <button type="button" class="tab" data-view="checkin" data-i18n="nav.checkin">Daily check-in</button>
    <button type="button" class="tab" data-view="crew" data-i18n="nav.crew">Crew</button>
    <details class="more-nav">
      <summary class="tab" data-i18n="nav.more">More</summary>
      <div class="more-nav-menu">
        <button type="button" class="tab" data-view="outlook" data-i18n="nav.outlook">30-day outlook</button>
        <button type="button" class="tab" data-view="report" data-i18n="nav.report">Report</button>
        <button type="button" class="tab" data-view="mission" data-i18n="nav.mission">Mission</button>
      </div>
    </details>
  </nav>

  <!-- Time slider: move through the mission day by day (dashboard and crew view). -->
  <div id="timebar" class="timebar" hidden></div>

  <main>
    <!-- Main screen: 3D body + six indicator cards. Everything else lives in the other tabs. -->
    <section id="view-dashboard" class="view">
      <div id="alerts"></div>
      <div class="dash">
        <div class="card bodycard">
          <div class="stagewrap">
            <div id="bodyStage" class="bodystage"></div>
            <!-- Small controls on top of the 3D view: today / +30 days, anatomy layers, help. -->
            <div class="stagebar">
              <div class="seg mini horizon" role="group">
                <button type="button" data-horizon="today" data-i18n="body.today">Today</button>
                <button type="button" data-horizon="30" data-i18n="body.plus30">+30 days</button>
              </div>
              <button type="button" class="iconbtn resetview" data-act="resetview" data-i18n-title="body.reset" aria-label="Reset view">⟲</button>
              <details class="menu layersmenu" id="layersMenu" hidden>
                <summary class="iconbtn"><span aria-hidden="true">☰</span> <span data-i18n="layers.button">Layers</span></summary>
                <div class="menubox"><div id="layerBar" class="layerbar"></div></div>
              </details>
              <details class="info"><summary aria-label="info">i</summary><div class="bubble" data-i18n="body.hint"></div></details>
            </div>
            <div id="pickLabel" class="picklabel" hidden></div>
            <div id="bodyLoad" class="bodyload" hidden></div>
          </div>
          <p class="projnote" id="projNote" data-i18n="body.projNote" hidden></p>
          <div class="slownote" id="slowNote" hidden></div>
          <div id="systemChips" class="chips"></div>
        </div>
        <div class="side">
          <div id="overview"></div>
          <div id="organPanel" class="card panel" hidden></div>
        </div>
      </div>
    </section>

    <section id="view-checkin" class="view" hidden>
      <div id="checkin"></div>
    </section>

    <section id="view-crew" class="view" hidden>
      <div id="crew"></div>
    </section>

    <section id="view-outlook" class="view" hidden>
      <div id="outlook"></div>
    </section>

    <section id="view-report" class="view" hidden>
      <div id="report"></div>
    </section>

    <!-- Mission: live space weather, radiation dose, reminders, streak, credits. -->
    <section id="view-mission" class="view" hidden>
      <div class="missionrow">
        <div id="spaceWeather"></div>
        <div id="doseCard"></div>
      </div>
      <div class="missionrow" id="routine"></div>
      <div class="card credits" id="credits"></div>
    </section>
  </main>

  <footer class="footer">
    <span data-i18n="footer.disclaimer"></span>
    · <button type="button" class="linkbtn" data-goto="mission" data-i18n="credits.title">Credits</button>
  </footer>

  <div id="emergency" class="emg" role="dialog" aria-modal="true" hidden></div>
  <div id="toast" class="toast" hidden></div>

  <script src="vendor/chart.umd.js"></script>
  <script type="module" src="js/app.js"></script>
</body>
</html>
